[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slm-calibration-quantization"
version = "0.1.0"
description = "Quantization x Calibration x Selective Prediction for Sub-3B SLMs on Bengali Hate-Speech Classification under Domain Shift"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "slm-calibration-quantization" }]
dependencies = [
    "torch>=2.5.0",
    "transformers>=4.46.0",
    "peft>=0.13.0",
    "accelerate>=1.0.0",
    "bitsandbytes>=0.45.0",
    "datasets>=3.0.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "statsmodels>=0.14.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0,<2.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "psutil>=6.0.0",
    "pynvml>=11.5.0",
    "huggingface_hub>=0.26.0",
    "sentencepiece>=0.2.0",
    "datasketch>=1.6.0",
    "sentence-transformers>=3.0.0",
    "netcal>=1.3.0",
    "gptqmodel>=2.0.0",
    "llama-cpp-python>=0.3.0",
    "gguf>=0.13.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
